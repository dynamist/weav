[tox]
env_list =
    py311
    py312
    py313
    py314
    lint
    type
min_version = 4.0

[testenv]
description = Run unit tests
package = wheel
wheel_build_env = .pkg
deps =
    pytest>=8.3.0
    pytest-cov>=6.0.0
commands =
    pytest {posargs:tests}

[testenv:lint]
description = Run linting and formatting checks
skip_install = false
deps =
    ruff>=0.8.0
commands =
    ruff check weav tests scripts
    ruff format --check weav tests scripts

[testenv:format]
description = Format code with ruff
skip_install = true
deps =
    ruff>=0.8.0
commands =
    ruff check --fix weav tests scripts
    ruff format weav tests scripts

[testenv:type]
description = Run type checking with mypy
skip_install = false
deps =
    mypy>=1.13.0
commands =
    mypy weav

[testenv:smoke]
# Not in env_list: it builds a wheel and installs it with pip, which is slower
# than the unit tests and is about the artifact rather than the code. Run it
# before tagging, and after changing anything the release workflow bundles.
# tox installs the wheel with pip, so dependencies resolve from the
# distribution's own metadata rather than from uv.lock -- the same resolve a
# user gets, which is the only way an undeclared dependency shows up.
description = Run the built CLI end to end, the way the release workflow does
package = wheel
wheel_build_env = .pkg
commands =
    python {toxinidir}/scripts/smoke.py --venv {envdir}

[testenv:all]
description = Run all checks (tests, linting, type checking)
skip_install = false
deps =
    {[testenv]deps}
    {[testenv:lint]deps}
    {[testenv:type]deps}
commands =
    pytest {posargs:tests}
    ruff check weav tests scripts
    ruff format --check weav tests scripts
    mypy weav
